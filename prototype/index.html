<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bento · Workflow prototype</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/bento-32.png">
<link rel="stylesheet" href="styles.css">
</head>
<body style="margin:0">
<div id="bento-workflow" aria-label="Bento meeting workflow prototype">
  <header class="b-chrome"><div class="b-brand"><img class="b-mark" src="assets/bento-64.png" width="28" height="28" alt="" aria-hidden="true">Bento</div><span class="b-demo">Workflow study · sample workspace</span><button type="button" class="b-button b-theme-toggle" data-theme-toggle aria-label="Dark mode" aria-pressed="false"><svg data-theme-icon="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg><svg data-theme-icon="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42m0-14.14-1.42 1.42m-11.3 11.3-1.42 1.42"/></svg></button></header>
  <div class="b-shell">
    <aside aria-label="Workspace navigation"><nav class="b-nav"><button type="button" class="cursor-interaction" data-view="daily"><i data-lucide="sun" aria-hidden="true"></i>Daily overview</button><button type="button" class="cursor-interaction" data-view="meeting"><i data-lucide="file-pen-line" aria-hidden="true"></i>Meeting note</button><button type="button" class="cursor-interaction" data-view="profile">Settings</button></nav><p class="b-sidebar-label">ACTIVE PROJECTS</p><nav id="b-project-nav" class="b-nav" aria-label="Projects"></nav></aside>
    <main id="b-main"></main>
  </div>
  <footer class="b-status" id="b-status" role="status" aria-live="polite">Sample workspace ready.</footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
