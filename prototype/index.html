<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bento · Workflow prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body style="margin:0">
<div id="bento-workflow" aria-label="Bento meeting workflow prototype">
  <header class="b-chrome"><div class="b-brand"><span class="b-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>Bento</div><span class="b-demo">Workflow study · sample workspace</span><button type="button" class="b-button b-theme-toggle" data-theme-toggle aria-pressed="false">Dark mode</button></header>
  <div class="b-shell">
    <aside aria-label="Workspace navigation"><nav class="b-nav"><button type="button" class="cursor-interaction" data-view="daily"><i data-lucide="sun" aria-hidden="true"></i>Daily overview</button><button type="button" class="cursor-interaction" data-view="meeting"><i data-lucide="file-pen-line" aria-hidden="true"></i>Meeting note</button><button type="button" class="cursor-interaction" data-view="profile">Profile</button></nav><p class="b-sidebar-label">ACTIVE PROJECTS</p><nav id="b-project-nav" class="b-nav" aria-label="Projects"></nav></aside>
    <main id="b-main"></main>
  </div>
  <footer class="b-status" id="b-status" role="status" aria-live="polite">Sample workspace ready.</footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
